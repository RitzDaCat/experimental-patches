<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Stock versus cadence-derived VRR repaint fallback ceiling</title>
<desc id="desc">Stock KWin uses a 33.33 millisecond fallback. On a 240 hertz output, the candidate ceiling follows measured foreground cadence down to the 4.17 millisecond physical output interval. Foreground game damage remains immediate in both designs.</desc>
<style>
    .bg { fill: #ffffff; }
    .text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .muted { fill: #59636e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .axis { stroke: #8c959f; stroke-width: 1.5; }
    .baseline { fill: #8c959f; }
    .adaptive { fill: #0969da; }
    .adaptive-line { fill: none; stroke: #0969da; stroke-width: 3; }
    .stock-line { fill: none; stroke: #8c959f; stroke-width: 3; stroke-dasharray: 8 6; }
    .timer { fill: #8250df; }
    .event { stroke: #cf222e; stroke-width: 2; }
    .frame { fill: #8c959f; opacity: 0.45; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .text { fill: #f0f6fc; }
      .muted { fill: #9da7b3; }
      .grid { stroke: #30363d; }
      .axis { stroke: #6e7681; }
      .baseline { fill: #6e7681; }
      .adaptive { fill: #58a6ff; }
      .adaptive-line { stroke: #58a6ff; }
      .stock-line { stroke: #9da7b3; }
      .timer { fill: #a371f7; }
      .event { stroke: #ff7b72; }
      .frame { fill: #6e7681; opacity: 0.55; }
    }
</style>
