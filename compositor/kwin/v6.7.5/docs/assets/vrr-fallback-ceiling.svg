<text class="muted" x="25" y="222.5" font-size="13" text-anchor="middle" transform="rotate(-90 25 222.5)">Fallback ceiling (ms)</text>
<text class="muted" x="40" y="412" font-size="12" text-anchor="start" font-weight="400">Continuous game damage normally cancels either fallback before it expires; this targets stalls and transition tails.</text>
